<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDVES Classroom Observation | Book a free demo</title>
<meta name="description" content="Every classroom observed by the same standard. See EDVES Classroom Observation on your own rubric.">
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--blue:#0c5e9e;--blue-d:#094a7e;--tint:#eef5fb;--ink:#12212e;--mute:#000000;--line:#d6e3ef;--white:#fff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{padding:22px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--blue);text-decoration:none}
.btn{display:inline-block;background:var(--blue);color:var(--white);font-weight:600;text-decoration:none;padding:14px 28px;border-radius:8px;transition:background .2s,transform .2s}
.btn:hover{background:var(--blue-d);transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid #7fb6e0;outline-offset:3px}
.btn.sm{padding:10px 20px;font-size:15px}
.btn.inv{background:var(--white);color:var(--blue)}
.btn.inv:hover{background:var(--tint)}

/* Hero */
.hero{padding:56px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
h1{font-size:clamp(36px,5.2vw,58px);line-height:1.08;letter-spacing:-.03em;font-weight:700}
.lead{margin:22px 0 32px;font-size:19px;color:var(--mute);max-width:46ch}

/* Floating icons */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;margin-bottom:18px}
.chip{width:60px;height:60px;border-radius:50%;background:var(--tint);display:grid;place-items:center;animation:float 4s ease-in-out infinite}
.chip:nth-child(2){animation-delay:.5s;animation-duration:4.4s}
.chip:nth-child(3){animation-delay:1s;animation-duration:3.8s}
.chip:nth-child(4){animation-delay:1.4s;animation-duration:4.2s}
.chip:nth-child(5){animation-delay:.3s;animation-duration:4.6s}

.fbrow{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 16px;margin-top:32px;max-width:380px}
.fi{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--blue-d);text-align:center}
.fb{width:72px;height:72px;border-radius:50%;background:var(--tint);display:grid;place-items:center;animation:float 4.5s ease-in-out infinite}
.fi:nth-child(2) .fb{animation-delay:.5s;animation-duration:4s}
.fi:nth-child(3) .fb{animation-delay:1s;animation-duration:4.8s}
.fi:nth-child(4) .fb{animation-delay:1.5s;animation-duration:4.2s}
.fi:nth-child(5) .fb{animation-delay:.8s;animation-duration:4.6s}
.fi:nth-child(6) .fb{animation-delay:1.9s;animation-duration:4.4s}
.d{opacity:.25;animation:dot 1.4s ease-in-out infinite}
.d2{animation-delay:.2s}
.d3{animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Animated moment: a lesson being scored, then feedback sent */
.panel{border:1px solid var(--line);border-radius:14px;padding:26px;background:var(--white);box-shadow:0 20px 50px rgba(12,94,158,.10)}
.panel h2{font-size:15px;font-weight:600;margin-bottom:4px}
.panel .sub{font-size:13px;color:var(--mute);margin-bottom:20px}
.row{margin-bottom:16px}
.row .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.track{height:8px;background:var(--tint);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--blue);border-radius:99px;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
.row:nth-of-type(1) .fill{--w:85%;animation-delay:.6s}
.row:nth-of-type(2) .fill{--w:70%;animation-delay:1.4s}
.row:nth-of-type(3) .fill{--w:92%;animation-delay:2.2s}
.row:nth-of-type(4) .fill{--w:64%;animation-delay:3s}
@keyframes grow{to{width:var(--w)}}
.sent{display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;border-radius:10px;background:var(--tint);color:var(--blue-d);font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);animation:pop .5s ease 4.2s forwards}
.sent svg{flex:none}
@keyframes pop{to{opacity:1;transform:none}}

/* Headline animation */
h1 .w{display:inline-block;opacity:0;transform:translateY(14px);animation:wordin .6s cubic-bezier(.2,.7,.2,1) forwards}
h1 .w:nth-child(1){animation-delay:.1s}
h1 .w:nth-child(2){animation-delay:.25s}
h1 .w:nth-child(3){animation-delay:.4s}
h1 .w:nth-child(4){animation-delay:.5s}
h1 .w:nth-child(5){animation-delay:.6s}
h1 .w:nth-child(6){animation-delay:.75s}
.b{color:var(--blue)}
.u{position:relative}
.u::after{content:"";position:abs
