<style>
:root{--blue:#0c5e9e;--blue-d:#094a7e;--tint:#eef5fb;--ink:#12212e;--mute:#000000;--line:#d6e3ef;--white:#fff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{padding:18px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{display:block;text-decoration:none;font-weight:700;font-size:22px;color:var(--blue)}
.logo img{display:block;height:48px;width:auto}
.nav{display:flex;align-items:center;gap:22px}
.tel{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:16px;text-decoration:none;color:var(--ink);white-space:nowrap;transition:color .2s}
.tel:hover{color:var(--blue)}
.tel .ti{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;flex:none}
.btn{display:inline-block;background:var(--blue);color:var(--white);font-weight:600;text-decoration:none;padding:14px 28px;border-radius:8px;transition:background .2s,transform .2s}
.btn:hover{background:var(--blue-d);transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid #7fb6e0;outline-offset:3px}
.btn.sm{padding:10px 20px;font-size:15px}
.btn.inv{background:var(--white);color:var(--blue)}
.btn.inv:hover{background:var(--tint)}

/* Hero */
.hero{padding:40px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
h1{font-size:clamp(36px,5.2vw,58px);line-height:1.08;letter-spacing:-.03em;font-weight:700}
.lead{margin:22px 0 32px;font-size:19px;color:var(--mute);max-width:46ch}
.hero-note{margin-top:14px;font-size:14px;color:var(--mute);max-width:46ch}
